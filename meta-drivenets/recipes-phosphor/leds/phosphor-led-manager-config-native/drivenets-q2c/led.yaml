      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan0-amber"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan1_ok:
    - name: "enclosure/fan1-green"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan1-amber"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan2_ok:
    - name: "enclosure/fan2-green"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan2-amber"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan3_ok:
    - name: "enclosure/fan3-green"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan3-amber"
      Action: "Off"
      DutyOn: 50
      Period: 0

# Per-fan LEDs — individual fan fault / absent
fan0_fault:
    - name: "enclosure/fan0-amber"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan0-green"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan1_fault:
    - name: "enclosure/fan1-amber"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan1-green"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan2_fault:
    - name: "enclosure/fan2-amber"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan2-green"
      Action: "Off"
      DutyOn: 50
      Period: 0

fan3_fault:
    - name: "enclosure/fan3-amber"
      Action: "On"
      DutyOn: 50
      Period: 0
    - name: "enclosure/fan3-green"
      Action: "Off"
      DutyOn: 50
      Period: 0
