# obmc-console server config for DriveNets Q2C / AST2600 EVB
# Console UART: ttyS4 (UART5_BMC)
# Baud: 115200
#
# Q2C hardware path:
#   UART0_BMC + UART1_BMC → physical UART_SEL MUX push-button → Console Board → UART_RJ45
#
# ttyS4 (UART5) is confirmed: ast2600_openbmc_spl_defconfig hardcodes
# CONFIG_BOOTARGS="console=ttyS4,115200n8 root=/dev/ram rw"
# and the upstream evb-ast2600 machine uses SERIAL_CONSOLES="115200;ttyS4".
#
# No aspeed-uart-routing is needed: the UART MUX on Q2C is a physical
# push-button switch, not the AST2600 software UART routing block.

local-tty = ttyS4
local-tty-baud = 115200
baud = 115200
