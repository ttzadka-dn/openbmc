# DriveNets AST2600 Machine Configuration
# This machine configuration supports DriveNets hardware based on AST2600

KERNEL_DEVICETREE = "aspeed/aspeed-ast2600-evb.dtb"

UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-evb"
SPL_BINARY = "spl/u-boot-spl.bin"

# Disable hardware root of trust by default
# To enable secure boot:
# 1. Set SOCSEC_SIGN_ENABLE to "1"
# 2. Provide platform OTP config
SOCSEC_SIGN_ENABLE = "0"

# Include AST2600 base configuration
require conf/machine/include/ast2600.inc

# Serial console configuration
SERIAL_CONSOLES = "115200;ttyS4"

# Flash configuration (64MB SPI flash)
FLASH_SIZE = "65536"

# Remove obmc-system-mgmt feature for now (not needed for basic EVB functionality)
# This can be re-enabled later when system management provider is configured
IMAGE_FEATURES:remove = "obmc-system-mgmt"

# Additional DriveNets-specific configurations can be added below
# EXTRA_IMAGE_FEATURES:append = " "
