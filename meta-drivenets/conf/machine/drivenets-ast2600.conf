# DriveNets AST2600 Machine Configuration
# AST2600 evaluation board — used as the development / bringup target.

# Use the upstream EVB device tree; replace with a custom DTS when ready.
KERNEL_DEVICETREE = "aspeed/aspeed-ast2600-evb.dtb"

# Pull in upstream AST2600 SoC defaults (MACHINE_ARCH, tune, etc.)
require conf/machine/include/ast2600.inc

# Pull in DriveNets-wide defaults shared by all AST2600 platforms
require conf/machine/include/drivenets-common.inc

# LED manager: use the AST2600 EVB LED group definition
PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "phosphor-led-manager-config-native"
