# DriveNets Q2C Machine Configuration
#
# Q2C — production DriveNets switch platform.
#
# BMC SoC: ASPEED AST2620 (AST2600-family variant; fewer PCIe lanes than AST2600)
# Module:  DC-SCM (Data Center Secure Control Module, OCP DC-SCM v2 form factor)
#          manufactured by Alpha Networks (part: 8AESQ2CMB0A1G)
#
# The DC-SCM module plugs into the Q2C carrier board via a Gold Finger connector.
# All carrier-board peripherals (fans, PSUs, temp sensors, LEDs) are accessed by
# the AST2620 through the DC-SCM's I2C / SGPIO connections to the carrier board.
#
# Host CPU: AMD x86 (COMe module)
#
# Management:
#   OOB NIC: Intel I210 attached to DC-SCM via PCIe Gen2 x1 → MDI (direct mgmt port)
#   NCSI:    AMD x86 COMe NIC → DC-SCM MAC (in-band management path)
#
# References:
#   Block diagram: DriveNets Q2C Switch Block Diagram_09172025.pdf
#   Schematic:     8AESQ2CMB0A1G_SCH_20251217D.pdf

# Custom device tree for Q2C DC-SCM hardware
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-drivenets-q2c.dtb"

# Pull in upstream AST2600 SoC defaults (MACHINE_ARCH, tune, etc.)
# AST2620 is a variant of AST2600; the inc file covers the whole family.
require conf/machine/include/ast2600.inc

# Pull in DriveNets-wide defaults shared by all AST2600/AST2620 platforms
require conf/machine/include/drivenets-common.inc

# LED manager: use the Q2C-specific LED group definition
PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "phosphor-led-manager-config-native"

# Host IPMI interface: Q2C uses KCS
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
