# DriveNets Q2C Machine Configuration
# Q2C - DriveNets platform based on ASPEED AST2600

# Device tree for Q2C hardware
KERNEL_DEVICETREE = "aspeed/aspeed-bmc-drivenets-q2c.dtb"

# U-Boot configuration
UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-evb"
SPL_BINARY = "spl/u-boot-spl.bin"

# Disable hardware root of trust by default
# Enable secure boot when ready:
# 1. Set SOCSEC_SIGN_ENABLE to "1"
# 2. Provide platform OTP config
SOCSEC_SIGN_ENABLE = "0"

# Include AST2600 base configuration
require conf/machine/include/ast2600.inc

# Serial console configuration
# Adjust ttyS number if Q2C uses different UART
SERIAL_CONSOLES = "115200;ttyS4"

# Flash configuration
# Update size based on Q2C hardware (in KB)
# 32MB = 32768, 64MB = 65536, 128MB = 131072
FLASH_SIZE = "65536"

# Remove obmc-system-mgmt feature for basic setup
# Re-enable when system management provider is configured
IMAGE_FEATURES:remove = "obmc-system-mgmt"

# Q2C-specific configurations
# Add preferred providers, features, etc. for Q2C hardware

# Example: If Q2C has specific LED configuration
# PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "q2c-led-manager-config-native"

# Example: If Q2C uses specific host IPMI interface
# PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"

# Example: Add Q2C-specific packages
# MACHINE_EXTRA_RRECOMMENDS += "q2c-platform-init"

# Example: If Q2C has specific network config
# MACHINE_FEATURES:append = " obmc-bmc-state-mgmt"
