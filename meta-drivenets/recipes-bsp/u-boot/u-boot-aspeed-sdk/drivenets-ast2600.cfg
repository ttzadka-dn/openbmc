# U-Boot kconfig fragment for drivenets-ast2600
# Applied on top of ast2600_openbmc_spl_defconfig + u-boot_flash_64M.cfg.
# Only overrides symbols that differ from those upstream defaults.

# BMC hostname shown in U-Boot prompt
CONFIG_SYS_PROMPT="drivenets-ast2600> "

# Environment: SPI NOR flash offset adjusted to match the DriveNets flash layout.
# FLASH_UBOOT_ENV_OFFSET:flash-65536 = "1152" KB = 0x120000
# (Upstream u-boot_flash_64M.cfg sets 0xE0000 = 896 KB; we override here.)
CONFIG_ENV_IS_IN_SPI_FLASH=y
CONFIG_ENV_OFFSET=0x120000
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_SECT_SIZE=0x10000

# Network: DHCP and TFTP for netboot during development
CONFIG_CMD_DHCP=y
CONFIG_CMD_TFTP=y

# Hardware watchdog
CONFIG_HW_WATCHDOG=y
CONFIG_ASPEED_WATCHDOG=y
